# Короткая ссылка на загрузчик: bootstrap.ps1 публикуется корнем GitHub Pages,
# так что работает  irm iheeae.github.io/tabula-rasa | iex
# Нужно один раз включить: Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [master]
    paths: [bootstrap.ps1, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт из bootstrap.ps1
        run: |
          mkdir _site
          cp bootstrap.ps1 _site/index.html
          cp bootstrap.ps1 _site/bootstrap.ps1
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
